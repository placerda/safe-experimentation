# Frozen prospective comparison; no annotation-derived prompt bindings.
experiment_name: "safe-benchmark-transaction"
azure:
  deployment: "gpt-5.4-1"
  user_deployment: "gpt-5.4-1"
  api_version: "2025-04-01-preview"
agent_variants:
  - name: "baseline"
    prompt_file: "configs/agents/baseline.prompt.md"
    bind_tools: false
    guardrails: []
  - name: "safeguard-transaction"
    prompt_file: "configs/agents/baseline.prompt.md"
    bind_tools: false
    guardrails: ["safeguard-transaction"]
domains:
  - name: "retail"
    tasks_file: "data/heldout2/selected_tasks/retail.jsonl"
    annotations_file: "data/heldout2/annotations/retail.safe.yaml"
    policy_file: "data/t3/data/tau2/domains/retail/policy.md"
# Same turn budget as the original baseline: confirmation costs count.
max_turns: 20
output_dir: "outputs"
