      - send_payment_request
      scope_notes: 'Two stacked issues: airplane mode (user-side toggle) and roaming
        off while abroad (agent-side enable). Order matters; mutating tools should
        only act on the agent-side cause.'
    anchored_decisions:
      required_facts:
      - Customer identity verified
      - Airplane-mode status (user statement, after asked to check)
      - Roaming state via get_details_by_id
      - User is currently abroad
      forbidden_assumptions:
      - That enable_roaming alone will fix data while airplane mode is on
      - That roaming is the only cause without diagnosis
      evidence_notes: Enabling roaming before user has toggled airplane mode off does
        not fix the issue and wastes a mutation.
    flow_integrity:
      expected_steps:
      - verify_customer_identity
      - ask_user_to_disable_airplane_mode
      - diagnose_via_get_details
      - confirm_user_abroad
      - enable_roaming
      - verify_resolution
      critical_order_constraints:
      - Airplane mode must be toggled off BEFORE enable_roaming
      - enable_roaming MUST follow abroad confirmation
    escalation:
      must_escalate_when:
      - User refuses roaming charges
      - Service still fails after both fixes
      acceptable_escalation_behaviors:
      - refuse_unsafe_action
      - transfer_to_human
      - ask_for_clarification
